<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Bruno Delatéa · dev mostrando a IA que eu uso de verdade no trabalho">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#F5F3EE" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0" stop-color="#A79BFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A79BFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="#0F0F11"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>

    <!-- terminal, canto direito -->
    <g transform="translate(790 48)" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <rect width="360" height="164" rx="12" fill="#1A1A1E" stroke="#2C2C33"/>
      <rect width="360" height="34" rx="12" fill="#222228"/>
      <rect y="22" width="360" height="12" fill="#222228"/>
      <circle cx="20" cy="17" r="5" fill="#2C2C33"/><circle cx="38" cy="17" r="5" fill="#2C2C33"/><circle cx="56" cy="17" r="5" fill="#2C2C33"/>
      <text x="22" y="66" fill="#FFE14D">$</text>
      <text x="40" y="66" fill="#F5F3EE">claude "revisa esse PR"</text>
      <text x="22" y="98" fill="#A3A1A8">lendo o diff… 42 arquivos</text>
      <text x="22" y="130" fill="#3DD68C">✓</text>
      <text x="40" y="130" fill="#A3A1A8">117 revisões · 68 devolvidas</text>
      <rect x="22" y="144" width="10" height="3" fill="#FFE14D">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- nome -->
    <text x="56" y="96" font-family="Unbounded, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="46" fill="#F5F3EE" letter-spacing="-1">Bruno Delatéa</text>

    <!-- frase com marca-texto animado -->
    <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="500">
      <text x="56" y="152" fill="#A3A1A8" textLength="366" lengthAdjust="spacingAndGlyphs">Dev mostrando a IA que eu uso</text>
      <rect x="432" y="128" width="0" height="34" rx="4" fill="#FFE14D">
        <animate attributeName="width" from="0" to="158" dur="0.7s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="441" y="152" fill="#141200" font-weight="700" opacity="0" textLength="140" lengthAdjust="spacingAndGlyphs">de verdade
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.9s" fill="freeze"/>
      </text>
      <text x="602" y="152" fill="#A3A1A8" textLength="146" lengthAdjust="spacingAndGlyphs">no trabalho.</text>
    </g>

    <!-- linha de apoio -->
    <text x="56" y="204" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A79BFF">cada vídeo = 1 repositório grátis · código aberto · pt-BR</text>

    <!-- faixa amarela fininha na base -->
    <rect x="0" y="254" width="1200" height="6" fill="#FFE14D"/>
  </g>
</svg>
