name: Atualizar README

on:
  schedule:
    - cron: "17 9 * * *" # todo dia 06:17 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/update-readme.yml]

permissions:
  contents: write

jobs:
  repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar tabela de repositórios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_repos.py
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza tabela de repositórios"
          git push
