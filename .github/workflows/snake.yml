name: Cobrinha de contribuições

on:
  schedule:
    - cron: "41 9 * * *" # todo dia 06:41 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFE14D&color_dots=#1A1A1E,#3B3675,#5F56B8,#8A7FE6,#A79BFF
            dist/snake-light.svg?palette=github-light&color_snake=#1A1A1E&color_dots=#EEEEF2,#D9D4FF,#BDB3FF,#A79BFF,#7D6FE0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
